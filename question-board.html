<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>질문판</title>

<!--
================================================================
  실시간 익명 질문판  (단일 HTML 파일)
================================================================

  [ 쓰는 법 ]
  - 학생용 : https://내주소/question-board.html?room=2-3
  - 교사용 : https://내주소/question-board.html?room=2-3#teacher
    (room 값만 반마다 바꿔서 쓰면 됩니다. 생략하면 'common')

  [ 준비 ]
  아래 FIREBASE_CONFIG 안의 값을 파이어베이스 콘솔에서 복사해
  그대로 덮어쓰면 끝입니다. 설정을 안 채우면 화면에 안내가 뜹니다.

  [ 보안 ]
  여기 적히는 apiKey는 공개되는 것이 정상입니다.
  실제 보호는 파이어베이스 콘솔의 '규칙(Rules)'이 담당합니다.
  함께 드린 안내의 규칙을 반드시 붙여넣으세요.
================================================================
-->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
  :root{
    --ink:#0E2430;        /* 배경 */
    --ink-2:#16323F;      /* 카드 */
    --edge:#27485A;       /* 경계선 */
    --paper:#E9F2F4;      /* 본문 글자 */
    --muted:#8CACB8;      /* 보조 글자 */
    --mark:#F5C55B;       /* 강조 (형광 노랑) */
    --warn:#E98A6B;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }

  a{color:var(--mark)}

  .wrap{max-width:1280px;margin:0 auto;padding:28px 22px 60px}

  /* ---------- 공통 머리말 ---------- */
  .head{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding-bottom:14px;border-bottom:1px solid var(--edge);margin-bottom:30px;
  }
  .head h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .room{
    font-size:13px;color:var(--ink);background:var(--mark);
    padding:2px 9px;border-radius:3px;font-weight:600;
  }
  .head .spacer{flex:1}
  .count{font-size:14px;color:var(--muted)}

  /* ================= 학생 화면 ================= */
  .student{max-width:560px;margin:0 auto;padding:44px 22px 60px}

  .student .lead{
    font-size:30px;font-weight:700;line-height:1.35;
    letter-spacing:-.03em;margin-bottom:10px;
  }
  .student .sub{color:var(--muted);font-size:15px;margin-bottom:30px}

  textarea{
    width:100%;min-height:150px;resize:vertical;
    background:var(--ink-2);color:var(--paper);
    border:1px solid var(--edge);border-radius:8px;
    padding:16px;font:inherit;font-size:17px;line-height:1.6;
  }
  textarea::placeholder{color:#5E8092}
  textarea:focus{outline:2px solid var(--mark);outline-offset:1px;border-color:transparent}

  .row{display:flex;align-items:center;gap:14px;margin-top:14px}
  .left{font-size:13px;color:var(--muted);flex:1}
  .left.over{color:var(--warn)}

  button{font:inherit;cursor:pointer;border:none;border-radius:7px}

  .send{
    background:var(--mark);color:#0E2430;
    font-weight:700;font-size:16px;padding:12px 26px;
  }
  .send:disabled{background:var(--edge);color:var(--muted);cursor:not-allowed}
  .send:focus-visible,.hide:focus-visible{outline:2px solid var(--paper);outline-offset:2px}

  .msg{margin-top:22px;font-size:15px;min-height:24px}
  .msg.ok{color:var(--mark)}
  .msg.bad{color:var(--warn)}

  .mine{margin-top:40px;border-top:1px solid var(--edge);padding-top:18px}
  .mine h2{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:12px}
  .mine li{
    list-style:none;font-size:15px;color:var(--muted);
    padding:9px 0 9px 14px;border-left:2px solid var(--edge);
    margin-bottom:8px;white-space:pre-wrap;word-break:break-word;
  }

  /* ================= 교사 화면 ================= */
  .board{columns:3 300px;column-gap:16px}

  .card{
    break-inside:avoid;background:var(--ink-2);
    border:1px solid var(--edge);border-left:3px solid var(--edge);
    border-radius:8px;padding:16px 16px 12px;margin-bottom:16px;
    white-space:pre-wrap;word-break:break-word;font-size:17px;line-height:1.55;
  }
  .card.fresh{border-left-color:var(--mark);animation:arrive .45s ease-out}
  @keyframes arrive{
    from{opacity:0;transform:translateY(-6px);background:#1F4254}
    to{opacity:1;transform:none;background:var(--ink-2)}
  }

  .card footer{
    display:flex;align-items:center;gap:10px;
    margin-top:12px;padding-top:9px;border-top:1px solid var(--edge);
  }
  .time{font-size:12px;color:var(--muted);flex:1}
  .hide{
    background:transparent;color:var(--muted);border:1px solid var(--edge);
    font-size:12px;padding:4px 10px;
  }
  .hide:hover{color:var(--warn);border-color:var(--warn)}

  .empty{
    grid-column:1/-1;color:var(--muted);font-size:16px;
    border:1px dashed var(--edge);border-radius:8px;padding:40px 24px;text-align:center;
  }

  /* QR 패널 */
  .qr{
    position:fixed;right:22px;bottom:22px;background:#fff;
    padding:12px 12px 8px;border-radius:10px;text-align:center;
  }
  .qr img,.qr canvas{display:block}
  .qr span{display:block;margin-top:6px;font-size:11px;color:#334;font-weight:600}
  .qr button{
    position:absolute;top:-9px;right:-9px;width:22px;height:22px;
    border-radius:50%;background:var(--edge);color:var(--paper);font-size:13px;line-height:1;
  }

  /* 설정 안내 */
  .setup{
    max-width:620px;margin:70px auto;padding:28px 24px;
    border:1px solid var(--warn);border-radius:10px;
  }
  .setup h2{font-size:19px;margin-bottom:12px;color:var(--warn)}
  .setup p{color:var(--muted);font-size:15px;margin-bottom:10px}
  .setup code{background:var(--ink-2);padding:2px 6px;border-radius:4px;font-size:14px}

  @media (max-width:640px){
    .student .lead{font-size:25px}
    .qr{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .card.fresh{animation:none}
  }
</style>
</head>
<body>

<div id="app"></div>

<script type="module">
/* ===================================================================
   1) 파이어베이스 설정  ← 여기만 바꾸면 됩니다
   =================================================================== */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyDTxoerjxSb5T0H8ZVcpSoJPCdhGH9Pyxc",
  authDomain:        "askanything-5c5d1.firebaseapp.com",
  projectId:         "askanything-5c5d1",
  storageBucket:     "askanything-5c5d1.firebasestorage.app",
  messagingSenderId: "835705284416",
  appId:             "1:835705284416:web:ac6359cdde97918cfdbca5"
};

const MAX_LEN = 300;   // 질문 글자 수 상한 (보안 규칙과 같은 값이어야 함)

/* ===================================================================
   2) 준비물 불러오기
   =================================================================== */
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc, doc,
  onSnapshot, query, orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const app  = document.getElementById("app");
const params = new URLSearchParams(location.search);
const ROOM = (params.get("room") || "common").trim().slice(0, 24);
const IS_TEACHER = location.hash.toLowerCase().includes("teacher");

/* 설정을 안 채웠으면 안내만 띄우고 멈춤 */
if (String(FIREBASE_CONFIG.projectId).includes("붙여넣기")) {
  app.innerHTML = `
    <div class="setup">
      <h2>파이어베이스 설정이 아직 비어 있습니다</h2>
      <p>이 파일 안의 <code>FIREBASE_CONFIG</code> 부분을 콘솔에서 복사한 값으로 바꿔 주세요.</p>
      <p>파이어베이스 콘솔 → 프로젝트 설정 → 내 앱 → 웹 앱의 <code>firebaseConfig</code>입니다.</p>
    </div>`;
  throw new Error("config empty");
}

let db;
try {
  db = getFirestore(initializeApp(FIREBASE_CONFIG));
} catch (e) {
  app.innerHTML = `<div class="setup"><h2>연결에 실패했습니다</h2>
    <p>설정값이 올바른지 확인해 주세요.</p><p><code>${e.message}</code></p></div>`;
  throw e;
}

const colRef = collection(db, "rooms", ROOM, "questions");

/* ===================================================================
   3) 학생 화면
   =================================================================== */
function renderStudent() {
  app.innerHTML = `
    <div class="student">
      <p class="lead">궁금한 걸 적어 주세요.</p>
      <p class="sub">이름은 남지 않습니다. 아직 잘 모르겠는 부분일수록 좋습니다.</p>

      <textarea id="text" maxlength="${MAX_LEN}"
        placeholder="예) 세포막이 물을 통과시킨다면 세포 안이 계속 불어나지 않는 이유가 뭔가요?"></textarea>

      <div class="row">
        <span class="left" id="left">${MAX_LEN}자까지</span>
        <button class="send" id="send">보내기</button>
      </div>

      <p class="msg" id="msg"></p>

      <div class="mine" id="mine" hidden>
        <h2>이번 시간에 내가 보낸 질문</h2>
        <ul id="mineList"></ul>
      </div>
    </div>`;

  const ta   = document.getElementById("text");
  const btn  = document.getElementById("send");
  const left = document.getElementById("left");
  const msg  = document.getElementById("msg");
  const mine = document.getElementById("mine");
  const list = document.getElementById("mineList");

  const update = () => {
    const n = ta.value.trim().length;
    left.textContent = n === 0 ? `${MAX_LEN}자까지` : `${MAX_LEN - n}자 남음`;
    left.classList.toggle("over", MAX_LEN - n < 30);
    btn.disabled = n === 0;
  };
  ta.addEventListener("input", update);
  update();

  async function send() {
    const text = ta.value.trim();
    if (!text) return;

    btn.disabled = true;
    btn.textContent = "보내는 중";
    msg.className = "msg";
    msg.textContent = "";

    try {
      await addDoc(colRef, { text, ts: serverTimestamp(), done: false });

      ta.value = "";
      update();
      msg.className = "msg ok";
      msg.textContent = "칠판에 올라갔습니다.";

      const li = document.createElement("li");
      li.textContent = text;
      list.prepend(li);
      mine.hidden = false;
    } catch (e) {
      msg.className = "msg bad";
      msg.textContent = "보내지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.";
      console.error(e);
    } finally {
      btn.textContent = "보내기";
      update();
    }
  }

  btn.addEventListener("click", send);
  // Ctrl(⌘) + Enter 로도 전송
  ta.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") send();
  });
}

/* ===================================================================
   4) 교사 화면 (실시간)
   =================================================================== */
function renderTeacher() {
  app.innerHTML = `
    <div class="wrap">
      <div class="head">
        <h1>질문판</h1>
        <span class="room">${ROOM}</span>
        <span class="spacer"></span>
        <span class="count" id="count">기다리는 중</span>
      </div>
      <div class="board" id="board">
        <div class="empty">아직 질문이 없습니다. 학생 화면 주소를 띄워 주세요.</div>
      </div>
    </div>
    <div class="qr" id="qr"><button id="qrX" title="닫기">×</button></div>`;

  const board = document.getElementById("board");
  const count = document.getElementById("count");

  buildQR();

  const seen = new Set();   // 이미 그린 질문 → 새 질문만 강조
  let first = true;

  const q = query(colRef, orderBy("ts", "desc"), limit(120));

  onSnapshot(q, snap => {
    const items = [];
    snap.forEach(d => {
      const v = d.data();
      if (!v.done) items.push({ id: d.id, ...v });
    });

    count.textContent = items.length ? `질문 ${items.length}개` : "기다리는 중";

    if (!items.length) {
      board.innerHTML = `<div class="empty">아직 질문이 없습니다. 학생 화면 주소를 띄워 주세요.</div>`;
      first = false;
      return;
    }

    board.innerHTML = "";
    for (const it of items) {
      const isNew = !first && !seen.has(it.id);
      seen.add(it.id);

      const card = document.createElement("article");
      card.className = "card" + (isNew ? " fresh" : "");

      const body = document.createElement("div");
      body.textContent = it.text;

      const foot = document.createElement("footer");
      const time = document.createElement("span");
      time.className = "time";
      time.textContent = it.ts?.toDate ? fmt(it.ts.toDate()) : "방금";

      const hide = document.createElement("button");
      hide.className = "hide";
      hide.textContent = "내리기";
      hide.addEventListener("click", async () => {
        hide.disabled = true;
        try { await updateDoc(doc(colRef, it.id), { done: true }); }
        catch (e) { hide.disabled = false; hide.textContent = "실패"; console.error(e); }
      });

      foot.append(time, hide);
      card.append(body, foot);
      board.append(card);
    }
    first = false;
  }, err => {
    board.innerHTML = `<div class="empty">질문을 불러오지 못했습니다.
      파이어베이스 규칙에서 읽기가 막혀 있는지 확인해 주세요.<br>${err.code || ""}</div>`;
    console.error(err);
  });

  function fmt(d) {
    return d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  }
}

/* 학생용 주소 QR — 실패해도 화면은 그대로 돌아갑니다 */
function buildQR() {
  const box = document.getElementById("qr");
  const url = location.origin + location.pathname + "?room=" + encodeURIComponent(ROOM);

  document.getElementById("qrX").addEventListener("click", () => box.remove());

  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
  s.onload = () => {
    const slot = document.createElement("div");
    box.append(slot);
    new window.QRCode(slot, { text: url, width: 128, height: 128 });
    const cap = document.createElement("span");
    cap.textContent = "휴대폰으로 찍어 주세요";
    box.append(cap);
  };
  s.onerror = () => box.remove();
  document.head.append(s);
}

/* ===================================================================
   5) 시작
   =================================================================== */
IS_TEACHER ? renderTeacher() : renderStudent();
</script>
</body>
</html>
